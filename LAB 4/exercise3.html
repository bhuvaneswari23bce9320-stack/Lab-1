<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System | AJAX CRUD</title>
    <style>
        :root { --primary: #4a69bd; --success: #388e3c; --danger: #d32f2f; --dark: #1e272e; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        
        .actions { grid-column: span 2; display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: 600; }
        .btn-create { background: var(--success); }
        .btn-update { background: var(--primary); display: none; }
        .btn-cancel { background: #7f8c8d; display: none; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: var(--dark); color: white; }
        
        #message { padding: 10px; margin: 10px 0; border-radius: 6px; display: none; text-align: center; }
        .msg-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .msg-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .btn-edit { background: #f39c12; margin-right: 5px; }
        .btn-del { background: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Management System</h2>
    <div id="message"></div>

    <div class="form-grid">
        <input type="text" id="stuId" placeholder="Student ID (e.g., S01)">
        <input type="text" id="stuName" placeholder="Full Name">
        <input type="text" id="stuDept" placeholder="Department">
        <input type="number" id="stuMarks" placeholder="Marks">
        <div class="actions">
            <button id="createBtn" class="btn-create" onclick="handleCreate()">Add Student</button>
            <button id="updateBtn" class="btn-update" onclick="handleUpdate()">Save Changes</button>
            <button id="cancelBtn" class="btn-cancel" onclick="resetForm()">Cancel</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Dept</th>
                <th>Marks</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentBody"></tbody>
    </table>
</div>

<script>
    // Simulated Database (Initial Read)
    let students = [
        { id: "S01", name: "Alice Johnson", dept: "CS", marks: 85 },
        { id: "S02", name: "Bob Smith", dept: "IT", marks: 78 }
    ];

    // --- HELPER: Display Messages ---
    function showStatus(text, type, code) {
        const msgDiv = document.getElementById("message");
        msgDiv.textContent = `[HTTP ${code}] ${text}`;
        msgDiv.className = type === 'success' ? 'msg-success' : 'msg-error';
        msgDiv.style.display = 'block';
        setTimeout(() => msgDiv.style.display = 'none', 3000);
    }

    // --- READ OPERATION ---
    function fetchStudents() {
        // Simulating AJAX Fetch
        const tbody = document.getElementById("studentBody");
        tbody.innerHTML = "";
        students.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td>${s.id}</td>
                    <td>${s.name}</td>
                    <td>${s.dept}</td>
                    <td>${s.marks}</td>
                    <td>
                        <button class="btn-edit" onclick="editMode('${s.id}')">Edit</button>
                        <button class="btn-del" onclick="handleDelete('${s.id}')">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // --- CREATE OPERATION ---
    async function handleCreate() {
        const payload = getFormData();
        
        // Validation
        if(!payload.id || !payload.name) {
            showStatus("Validation Failed: Missing fields", "error", 400);
            return;
        }

        // Simulating POST Request
        if (students.find(s => s.id === payload.id)) {
            showStatus("Student already exists", "error", 409);
        } else {
            students.push(payload);
            showStatus("Student added successfully", "success", 201);
            fetchStudents();
            resetForm();
        }
    }

    // --- DELETE OPERATION ---
    function handleDelete(id) {
        // Simulating DELETE Request
        const index = students.findIndex(s => s.id === id);
        if (index !== -1) {
            students.splice(index, 1);
            showStatus("Record deleted", "success", 200);
            fetchStudents();
        } else {
            showStatus("Record not found", "error", 404);
        }
    }

    // --- UPDATE OPERATION ---
    function editMode(id) {
        const student = students.find(s => s.id === id);
        document.getElementById("stuId").value = student.id;
        document.getElementById("stuId").disabled = true;
        document.getElementById("stuName").value = student.name;
        document.getElementById("stuDept").value = student.dept;
        document.getElementById("stuMarks").value = student.marks;

        document.getElementById("createBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "inline-block";
        document.getElementById("cancelBtn").style.display = "inline-block";
    }

    function handleUpdate() {
        const id = document.getElementById("stuId").value;
        const index = students.findIndex(s => s.id === id);

        if (index !== -1) {
            students[index] = getFormData();
            showStatus("Record updated", "success", 200);
            fetchStudents();
            resetForm();
        } else {
            showStatus("Update failed", "error", 500);
        }
    }

    // Utilities
    function getFormData() {
        return {
            id: document.getElementById("stuId").value,
            name: document.getElementById("stuName").value,
            dept: document.getElementById("stuDept").value,
            marks: document.getElementById("stuMarks").value
        };
    }

    function resetForm() {
        document.getElementById("stuId").disabled = false;
        document.querySelectorAll("input").forEach(i => i.value = "");
        document.getElementById("createBtn").style.display = "inline-block";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("cancelBtn").style.display = "none";
    }

    window.onload = fetchStudents;
</script>
</body>
</html>
