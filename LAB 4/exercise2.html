<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Product Search System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 16px;
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 18px 20px 18px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            background: #f8fafc;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            background: white;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 20px;
        }

        .loading {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
            font-size: 18px;
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .results-container {
            min-height: 100px;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            font-size: 18px;
        }

        .products-grid {
            display: grid;
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: slideInUp 0.5s ease forwards;
        }

        .product-card:nth-child(2) { animation-delay: 0.1s; }
        .product-card:nth-child(3) { animation-delay: 0.2s; }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border-color: #667eea;
        }

        .product-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .product-name {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #38a169;
            background: #f0fff4;
            padding: 8px 16px;
            border-radius: 12px;
        }

        .product-category {
            color: #667eea;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #feb2b2;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Product Search</h1>
        <p class="subtitle">Live search from JSON data with debouncing</p>
       
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                class="search-input"
                id="searchInput"
                placeholder="Search products (headphones, shoes, wallet...)"
            >
            <span class="loading" id="loadingIndicator">⏳</span>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div class="results-container">
            <div id="results" class="products-grid"></div>
        </div>
    </div>

    <script>
        // YOUR EXACT JSON DATA as products.json simulation
        const PRODUCTS_DATA = {
            "products": [
                {"id":1,"name":"Wireless Bluetooth Headphones","price":59.99,"category":"Electronics"},
                {"id":2,"name":"Leather Wallet","price":29.99,"category":"Accessories"},
                {"id":3,"name":"Running Shoes","price":89.99,"category":"Footwear"},
                {"id":4,"name":"Stainless Steel Water Bottle","price":19.99,"category":"Kitchen"},
                {"id":5,"name":"Yoga Mat","price":24.99,"category":"Fitness"},
                {"id":6,"name":"Bluetooth Speaker","price":39.99,"category":"Electronics"},
                {"id":7,"name":"Sunglasses","price":14.99,"category":"Accessories"},
                {"id":8,"name":"Backpack","price":49.99,"category":"Accessories"},
                {"id":9,"name":"Desk Lamp","price":34.99,"category":"Home"},
                {"id":10,"name":"Notebook Set","price":9.99,"category":"Stationery"},
                {"id":11,"name":"Coffee Maker","price":74.99,"category":"Kitchen"},
                {"id":12,"name":"Wireless Mouse","price":22.99,"category":"Electronics"},
                {"id":13,"name":"Phone Case","price":12.99,"category":"Accessories"},
                {"id":14,"name":"Fitness Tracker","price":44.99,"category":"Electronics"},
                {"id":15,"name":"Ceramic Mug","price":8.99,"category":"Kitchen"}
            ]
        };

        //  DEBOUNCE UTILITY FUNCTION
        function debounce(func, delay) {
            let timeoutId;
            return function(...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func.apply(this, args), delay);
            };
        }

        class ProductSearch {
            constructor() {
                this.searchInput = document.getElementById('searchInput');
                this.resultsContainer = document.getElementById('results');
                this.loadingIndicator = document.getElementById('loadingIndicator');
                this.errorMessage = document.getElementById('errorMessage');
               
                this.products = PRODUCTS_DATA.products;
                this.debouncedSearch = debounce(this.performSearch.bind(this), 400);

                this.init();
            }

            init() {
                // ✅ DEBOUNCED SEARCH (400ms delay)
                this.searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.trim();
                    if (query.length < 2) {
                        this.clearResults();
                        return;
                    }
                    this.debouncedSearch(query);
                });
            }

            async performSearch(query) {
                this.showLoading();

                try {
                    // ✅ SIMULATE AJAX REQUEST (real server delay)
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // ✅ SEARCH IN JSON DATA (server-side simulation)
                    const filteredProducts = this.products.filter(product =>
                        product.name.toLowerCase().includes(query.toLowerCase()) ||
                        product.category.toLowerCase().includes(query.toLowerCase())
                    );

                    if (filteredProducts.length === 0) {
                        this.showNoResults();
                    } else {
                        this.displayProducts(filteredProducts);
                    }

                } catch (error) {
                    this.showError('Failed to fetch products. Please try again.');
                } finally {
                    this.hideLoading();
                }
            }

            displayProducts(products) {
                this.resultsContainer.innerHTML = products.map(product => `
                    <div class="product-card">
                        <div class="product-header">
                            <div>
                                <h3 class="product-name">${product.name}</h3>
                                <div class="product-category">${product.category}</div>
                            </div>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                        </div>
                    </div>
                `).join('');
                this.hideError();
            }

            showNoResults() {
                this.resultsContainer.innerHTML = `
                    <div class="no-results">
                        <div style="font-size: 48px; margin-bottom: 16px;">📭</div>
                        No results found
                    </div>
                `;
                this.hideError();
            }

            showLoading() {
                this.loadingIndicator.style.display = 'block';
                this.clearResults();
                this.hideError();
            }

            hideLoading() {
                this.loadingIndicator.style.display = 'none';
            }

            clearResults() {
                this.resultsContainer.innerHTML = '';
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.clearResults();
            }

            hideError() {
                this.errorMessage.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ProductSearch();
        });
    </script>
</body>
</html>
