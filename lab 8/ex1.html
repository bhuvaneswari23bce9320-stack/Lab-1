<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        h2 {
            border-bottom: 2px solid black;
            padding-bottom: 5px;
        }
        .box {
            border: 1px solid gray;
            padding: 20px;
            margin-top: 20px;
            width: 400px;
        }
    </style>
</head>
<body>

<h2>Student Marks Calculator</h2>

<div class="box" id="output"></div>

<script>
let studentName = "Arun";
let mark1 = 85;
let mark2 = 90;
let mark3 = 88;

const calculateAverage = (m1, m2, m3) => (m1 + m2 + m3) / 3;

let total = mark1 + mark2 + mark3;
let average = calculateAverage(mark1, mark2, mark3);

document.getElementById("output").innerHTML = `
Student Name: ${studentName} <br><br>
Math: ${mark1} <br>
Science: ${mark2} <br>
English: ${mark3} <br><br>
-----------------------<br>
Total Marks: ${total} <br>
Average Marks: ${average.toFixed(2)}
`;
</script>

</body>
</html>
