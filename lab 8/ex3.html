<!DOCTYPE html>
<html>
<head>
    <title>Course Enrollment</title>
    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }
        h2 {
            border-bottom: 2px solid black;
            padding-bottom: 5px;
        }
        .box {
            border: 1px solid gray;
            padding: 20px;
            margin-top: 20px;
            width: 500px;
        }
    </style>
</head>
<body>

<h2>Course Enrollment</h2>

<div class="box" id="output"></div>

<script>
class Course {
    constructor(courseName, instructor) {
        this.courseName = courseName;
        this.instructor = instructor;
    }

    displayCourse() {
        return `Course: ${this.courseName}, Instructor: ${this.instructor}`;
    }
}

let course1 = new Course("Web Technologies", "Dr. Krishna");

let enrollCourse = new Promise((resolve, reject) => {
    let seatsAvailable = true;

    if (seatsAvailable)
        resolve("Enrollment Successful");
    else
        reject("Course Full");
});

enrollCourse
    .then(msg => {
        document.getElementById("output").innerHTML =
            course1.displayCourse() + "<br><br>" + msg;
    })
    .catch(err => {
        document.getElementById("output").innerHTML =
            course1.displayCourse() + "<br><br>" + err;
    });
</script>

</body>
</html>
