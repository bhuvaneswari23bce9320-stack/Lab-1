<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Library | DOM Book Tracker</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #3498db; 
            --success: #27ae60; 
            --warning: #f39c12; 
            --danger: #e74c3c; 
            --light: #ecf0f1;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--primary);
            min-height: 100vh;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: white; 
            padding: 40px;
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 { 
            margin: 0;
            color: var(--primary);
            font-size: 2.5em;
            font-weight: 300;
        }
        .subtitle {
            color: #7f8c8d;
            margin-top: 5px;
            font-size: 1.1em;
        }
        
        .form-row { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; 
            margin-bottom: 25px;
            align-items: end;
        }
        .form-group {
            position: relative;
        }
        input, select { 
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--primary);
            font-size: 0.9em;
        }
        button { 
            padding: 12px 24px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--accent), #2980b9);
            color: white; 
        }
        .btn-primary:hover { 
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.3);
        }
        .btn-danger { 
            background: linear-gradient(135deg, var(--danger), #c0392b);
            color: white;
            padding: 12px 20px;
            font-size: 14px;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.3);
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-top: 4px solid var(--accent);
        }
        .stat-number {
            font-size: 2.5em;
            font-weight: 700;
            color: var(--accent);
            margin: 0;
        }
        .stat-label {
            color: #7f8c8d;
            font-size: 0.95em;
            margin: 5px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        th, td { 
            text-align: left; 
            padding: 18px 16px; 
            border-bottom: 1px solid #f1f3f4;
        }
        th { 
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.85em;
            color: #5a6c7d;
        }
        tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
            transition: all 0.2s ease;
        }
        .status-badge { 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.8em; 
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .Available { 
            background: linear-gradient(135deg, #d4edda, #c3e6cb); 
            color: #155724; 
        }
        .Borrowed { 
            background: linear-gradient(135deg, #fff3cd, #ffeaa7); 
            color: #856404; 
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }
        .empty-state i {
            font-size: 4em;
            display: block;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        @media (max-width: 768px) {
            .container { padding: 20px; margin: 10px; }
            .form-row { grid-template-columns: 1fr; }
            table { font-size: 0.9em; }
            th, td { padding: 12px 8px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📚 Pro-Library</h1>
        <p class="subtitle">Advanced DOM Book Tracker</p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalBooks">0</div>
            <div class="stat-label">Total Books</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="availableBooks">0</div>
            <div class="stat-label">Available</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="borrowedBooks">0</div>
            <div class="stat-label">Borrowed</div>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="bookId">Book ID</label>
            <input type="text" id="bookId" placeholder="e.g., 103" maxlength="10">
        </div>
        <div class="form-group">
            <label for="title">Book Title</label>
            <input type="text" id="title" placeholder="Enter book title">
        </div>
        <div class="form-group">
            <label for="author">Author</label>
            <input type="text" id="author" placeholder="Author name">
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
            </select>
        </div>
        <div class="form-group">
            <button class="btn-primary" onclick="addBook()">➕ Add Book</button>
        </div>
    </div>

    <table id="bookTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<script>
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [
        { id: '101', title: 'Clean Code', author: 'Robert C. Martin', status: 'Available' },
        { id: '102', title: 'JavaScript: The Good Parts', author: 'Douglas Crockford', status: 'Borrowed' },
        { id: '103', title: 'You Don\'t Know JS', author: 'Kyle Simpson', status: 'Available' }
    ];

    // Save to localStorage whenever books change
    function saveBooks() {
        localStorage.setItem('libraryBooks', JSON.stringify(books));
    }

    // Update statistics
    function updateStats() {
        const total = books.length;
        const available = books.filter(b => b.status === 'Available').length;
        const borrowed = total - available;
        
        document.getElementById('totalBooks').textContent = total;
        document.getElementById('availableBooks').textContent = available;
        document.getElementById('borrowedBooks').textContent = borrowed;
    }

    // Render table
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        
        if (books.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-state">
                        <div>📖</div>
                        <h3>No books in library</h3>
                        <p>Add your first book using the form above</p>
                    </td>
                </tr>
            `;
        } else {
            tbody.innerHTML = books.map(book => `
                <tr>
                    <td><strong>${book.id}</strong></td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td><span class="status-badge ${book.status}">${book.status}</span></td>
                    <td>
                        <button class="btn-primary" onclick="toggleStatus('${book.id}')" style="padding: 8px 16px; font-size: 14px; margin-right: 8px;">
                            ${book.status === 'Available' ? '📤 Borrow' : '📥 Return'}
                        </button>
                        <button class="btn-danger" onclick="deleteBook('${book.id}')">🗑️ Delete</button>
                    </td>
                </tr>
            `).join('');
        }
        
        updateStats();
        saveBooks();
    }

    // Add new book
    function addBook() {
        const id = document.getElementById('bookId').value.trim();
        const title = document.getElementById('title').value.trim();
        const author = document.getElementById('author').value.trim();
        const status = document.getElementById('status').value;

        // Enhanced validation
        if (!id || !title || !author) {
            showNotification('Please fill all fields!', 'error');
            return;
        }

        if (books.find(book => book.id === id)) {
            showNotification('Book ID already exists!', 'error');
            return;
        }

        books.push({ id, title, author, status });
        renderTable();
        clearInputs();
        showNotification('Book added successfully!', 'success');
    }

    // Toggle book status
    function toggleStatus(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = book.status === 'Available' ? 'Borrowed' : 'Available';
            renderTable();
            showNotification('Status updated!', 'success');
        }
    }

    // Delete book
    function deleteBook(id) {
        if (confirm('Are you sure you want to delete this book?')) {
            books = books.filter(b => b.id !== id);
            renderTable();
            showNotification('Book deleted!', 'success');
        }
    }

    // Clear form inputs
    function clearInputs() {
        document.getElementById('bookId').value = '';
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        document.getElementById('status').value = 'Available';
    }

    // Notification system
    function showNotification(message, type = 'success') {
        // Create notification element
        const notification = document.createElement('div');
        notification.style.cssText = `
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            padding: 16px 24px; border-radius: 8px; color: white;
            font-weight: 600; font-size: 14px; box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: ${type === 'success' ? '#27ae60' : '#e74c3c'};
            transform: translateX(400px); transition: all 0.3s ease;
        `;
        notification.textContent = message;
        document.body.appendChild(notification);

        // Animate in
        setTimeout(() => notification.style.transform = 'translateX(0)', 100);

        // Auto remove
        setTimeout(() => {
            notification.style.transform = 'translateX(400px)';
            setTimeout(() => document.body.removeChild(notification), 300);
        }, 3000);
    }

    // Form submission on Enter key
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addBook();
        }
    });

    // Initialize app
    document.addEventListener('DOMContentLoaded', function() {
        renderTable();
    });
</script>

</body>
</html>
