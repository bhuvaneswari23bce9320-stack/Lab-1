<!DOCTYPE html>
<html>

<head>

<title>Student Notes Manager</title>

<style>

body{
font-family: Arial;
background:#f4f6fb;
margin:0;
}

header{
background:#1e40af;
color:white;
padding:20px;
text-align:center;
font-size:26px;
}

.container{
width:70%;
margin:auto;
margin-top:30px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:5px;
}

button{
padding:10px 15px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.addBtn{
background:#2563eb;
color:white;
}

.viewBtn{
background:#16a34a;
color:white;
margin-left:10px;
}

.deleteBtn{
background:#dc2626;
color:white;
}

.note{
background:#f8fafc;
padding:15px;
margin-top:10px;
border-left:5px solid #2563eb;
border-radius:5px;
}

</style>

</head>

<body>

<header>
Student Notes Manager
</header>

<div class="container">

<div class="card">

<h3>Add New Note</h3>

<label>Title</label>
<input id="title">

<label>Subject</label>
<input id="subject">

<label>Description</label>
<input id="description">

<button class="addBtn" onclick="addNote()">Add Note</button>
<button class="viewBtn" onclick="viewNotes()">View Notes</button>

</div>

<div class="card">

<h3>Stored Notes</h3>

<div id="notes"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
